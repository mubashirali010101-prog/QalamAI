<script>
    const btn = document.querySelector('.magic-btn');
    const input = document.querySelector('input[type="text"]');
    const output = document.querySelector('.output-placeholder');

    btn.addEventListener('click', async () => {
        if(!input.value.trim()) return alert('Please enter a prompt!');
        
        btn.innerText = 'Generating Magic... ✨';
        output.innerText = 'Connecting to QalamAI Core Engine...';

        try {
            // Hum direct relative link use karenge jo Vercel serverless functions ke liye automatic chalta hai
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input.value })
            });
            
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'Server Error');
            }

            const data = await response.json();
            output.innerText = data.text || 'Error generating response.';
        } catch (err) {
            output.innerText = 'AI Engine Response: ' + err.message;
        } finally {
            btn.innerText = 'Generate Magic ✨';
        }
    });
</script>
