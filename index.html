<script>
    // 1. Core Config (Agar aapke paas API key abhi nahi bhi lagi, tab bhi proxy block nahi hone degi)
    const GEMINI_API_KEY = "YOUR_REAL_API_KEY_HERE"; 
    
    // Direct link block ho toh hum is automated tunnel routing ko target karte hain:
    const DIRECT_ENDPOINT = `https://googleapis.com{GEMINI_API_KEY}`;
    const PROXY_ENDPOINT = `https://allorigins.win{encodeURIComponent(DIRECT_ENDPOINT)}`;

    const generateBtn = document.getElementById('generate-btn') || document.querySelector('button');
    const promptInput = document.getElementById('prompt-input') || document.querySelector('input[type="text"]') || document.querySelector('textarea');
    const outputContainer = document.getElementById('output-container') || document.querySelector('.border-dashed') || document.querySelector('[class*="Engine Output"]');

    if (generateBtn && promptInput && outputContainer) {
        generateBtn.addEventListener('click', async () => {
            const promptText = promptInput.value.trim();
            
            if (!promptText) {
                alert("Please write a prompt first!");
                return;
            }

            // UI State Change: Freeze state to prevent loops
            generateBtn.disabled = true;
            const originalBtnText = generateBtn.innerHTML;
            generateBtn.innerHTML = "Generating Magic... ✨";
            outputContainer.innerHTML = `<span style="color: #a78bfa; font-style: italic;">QalamAI Engine is communicating safely via secure tunnel...</span>`;

            // Payload Structure Setup
            const payload = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            try {
                // First Attempt: Safe Proxy Route to completely bypass "Failed to fetch" browser blocks
                const response = await fetch(PROXY_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Tunnel routing issue.");

                const proxyData = await response.json();
                // AllOrigins wraps data inside a contents string, we parse it safely here:
                const data = JSON.parse(proxyData.contents);
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    outputContainer.style.color = "#f3f4f6";
                    outputContainer.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    throw new Error(data.error.message || "API Key Invalid");
                } else {
                    throw new Error("Invalid structure returned.");
                }

            } catch (error) {
                console.warn("Proxy tunnel bypassed, trying direct secondary link...");
                
                // Fallback Attempt: Agar proxy server temporary busy ho, toh direct link backup chalayein
                try {
                    const directResponse = await fetch(DIRECT_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const directData = await directResponse.json();
                    if (directData.candidates && directData.candidates[0].content.parts[0].text) {
                        outputContainer.style.color = "#f3f4f6";
                        outputContainer.innerText = directData.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error(directData.error?.message || "Authentication Failed");
                    }
                } catch (fallbackError) {
                    outputContainer.innerHTML = `<span style="color: #f87171;">System Configuration Block: Kindly ensure your Google Studio API Key is valid. Error: ${fallbackError.message}</span>`;
                }
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = originalBtnText;
            }
        });
    }
</script>
