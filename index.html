```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini API Demo</title>
</head>

<body>

  <textarea id="promptInput" placeholder="Enter your prompt..."></textarea>
  <button id="generateBtn">Generate</button>

  <div id="output"></div>

  <script>
    // IMPORTANT:
    // Do not expose a real API key in production frontend code.
    // Use a backend/server-side proxy for production applications.
    const API_KEY = "YOUR_GEMINI_API_KEY";

    const MODEL = "gemini-1.5-flash";

    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("promptInput");
    const output = document.getElementById("output");

    async function generateContent() {
      const userPrompt = promptInput.value.trim();

      if (!userPrompt) {
        output.textContent = "Please enter a prompt.";
        return;
      }

      // UI loading state
      generateBtn.disabled = true;
      generateBtn.textContent = "Loading...";
      output.textContent = "";

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY
            },

            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: userPrompt
                    }
                  ]
                }
              ]
            })
          }
        );

        // Convert HTTP response to JSON
        const data = await response.json();

        // Handle API errors
        if (!response.ok) {
          throw new Error(
            data?.error?.message || "Gemini API request failed."
          );
        }

        // Exact response path requested
        const generatedText =
          data.candidates[0].content.parts[0].text;

        // Display result
        output.textContent = generatedText;

      } catch (error) {
        console.error("Gemini API Error:", error);

        output.textContent =
          "Error: " + (error.message || "Something went wrong.");

      } finally {
        // Restore UI state
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";
      }
    }

    generateBtn.addEventListener("click", generateContent);
  </script>

</body>
</html>
